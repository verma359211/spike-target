name: Run reproduction test

run-name: repro-${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Unique reproduction run ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx jest repro --json --outputFile=result.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result
          path: result.json
